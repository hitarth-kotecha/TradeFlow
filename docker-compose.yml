# TradeFlow local stack (spec §18.1). One command brings up the whole platform:
#   mvn clean package && docker compose up --build
# Debug UIs (kafka-ui, redis-commander) are behind the 'tools' profile:
#   docker compose --profile tools up
#
# Concept 2 reminders: services reach each other by SERVICE NAME on the private network;
# the host reaches them through the published "host:container" ports.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tradeflow
      POSTGRES_USER: tradeflow
      POSTGRES_PASSWORD: tradeflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeflow -d tradeflow"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Single-broker Kafka in KRaft mode (no ZooKeeper, Concept 3).
  # Advertised as kafka:9092 for in-network clients (the app + kafka-ui both run in Compose).
  # All values quoted so YAML keeps them as strings (the listener URLs contain colons).
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "6"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  tradeflow-app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres ACCEPTS connections (Concept 2, Idea D)
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker  # selects application-docker.yml (postgres host = service name)
    ports:
      - "8080:8080"

  # --- Debug UIs (only with: docker compose --profile tools up) ---------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  pgdata:
