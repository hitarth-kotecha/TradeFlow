name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest   # Docker is available for Testcontainers (Postgres/Redis/Kafka)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Runs unit + Testcontainers integration tests and the JaCoCo coverage gate (NFR-TEST-01).
      - name: Build, test, verify
        run: mvn -B --no-transfer-progress clean verify
